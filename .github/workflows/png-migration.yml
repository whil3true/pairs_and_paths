name: Temporary PNG migration

on:
  push:
    branches:
      - task-8-3-png-runtime-symbols
    paths:
      - .github/workflows/png-migration.yml
      - scripts/migrate-symbols-to-png.py

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-8-3-png-runtime-symbols
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check cairosvg pillow
      - run: python scripts/migrate-symbols-to-png.py
      - name: Commit generated PNGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/symbols/*.png
          git diff --cached --quiet && exit 0
          git commit -m "Generate PNG runtime symbol assets"
          git push origin HEAD:task-8-3-png-runtime-symbols
